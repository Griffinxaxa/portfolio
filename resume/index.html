<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Griffin DesRoches</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      color: #000000;
      font-family: "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 900px;
      min-height: 100vh;
      margin: 0;
      padding: 48px 24px 48px 48px;
      text-align: left;
      display: flex;
      flex-direction: column;
    }

    p {
      font-size: 16px;
      margin-bottom: 16px;
    }

    a {
      color: #000000;
      text-decoration: underline;
      text-decoration-color: #8b2942;
      text-underline-offset: 2px;
    }

    .resume-embed {
      width: 100%;
      flex: 1;
      min-height: 75vh;
      border: 1px solid #eeeeee;
    }

    @media (max-width: 600px) {
      main {
        padding: 40px 24px 48px 40px;
      }
    }
  </style>
</head>
<body>
  <main>
    <p><a href="../">back</a></p>
    <embed class="resume-embed" src="../images/DesRoches_SWE.pdf" type="application/pdf">
  </main>
</body>
</html>
