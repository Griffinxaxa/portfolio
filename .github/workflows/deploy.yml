name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p site/images site/resume site/photo-of-me
          cp index.html site/
          cp resume/index.html site/resume/
          cp photo-of-me/index.html site/photo-of-me/
          cp images/DesRoches_SWE.pdf site/images/
          cp images/photo-of-me.jpg site/images/

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          clean: true
